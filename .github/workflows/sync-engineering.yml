name: Sync engineering version

# Copies the "engineering" branch into the engineering/ folder and opens a
# pull request to main (main is protected). After merging, it is live at
# https://ghulamnabi-dev.github.io/engineering/
on:
  workflow_dispatch:
  push:
    branches: [engineering]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy engineering branch into engineering/
        run: |
          set -e
          git fetch origin engineering
          rm -rf engineering
          mkdir engineering
          git archive origin/engineering | tar -x -C engineering
          cd engineering
          rm -rf .gitignore .nojekyll README.md robots.txt 404.html tools .github
          grep -rlI --include='*.html' --include='*.xml' --include='*.js' --include='*.css' 'https://ghulamnabi-dev.github.io/' . | xargs -r sed -i 's#https://ghulamnabi-dev.github.io/#https://ghulamnabi-dev.github.io/engineering/#g'
      - name: Push to sync branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A engineering
          if git diff --cached --quiet; then echo "engineering/ is already up to date"; exit 0; fi
          git checkout -b engineering-sync
          git commit -m "Update engineering/ from the engineering branch"
          git push -f origin engineering-sync
          gh pr create --base main --head engineering-sync \
            --title "Update the live engineering version" \
            --body "Copies the engineering branch into engineering/ (live at https://ghulamnabi-dev.github.io/engineering/)." \
            || echo "Pull request already open, or Actions may not create PRs here; open one from engineering-sync to main."
